name: CI Checks

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint # 1. Lint check (ESLint)
      - run: pnpm exec prettier --check . # 2. Formatting check (Prettier)
      - run: pnpm tsc --noEmit # 3. Type check
      - run: pnpm test # 4. Unit tests
